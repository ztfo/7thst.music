<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esta carta no está · llü</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<meta name="theme-color" content="#0b0b0e">
<!-- absolute paths: GitHub Pages serves this page at whatever address was missing.
     A lost visitor lands in a terminal; its prompt knows a few commands and runs nothing typed. -->
<style>
  :root { --bg: #0b0b0e; --ink: #e8e8ea; --ink-2: #c9c9cf; --dim: #8a8a94; --faint: #6c6c76; --accent: #5b9cff; --err: #ff8a80; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink-2); font: 13px/22px var(--mono); -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; padding: 28px 24px 40px; }
  p { margin: 0; min-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ps { color: var(--accent); }
  .ps i { color: var(--dim); font-style: normal; }
  .e { color: var(--err); }
  .d { color: var(--dim); }
  .i { color: var(--ink); }
  .gap { height: 22px; }
  form { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  input { flex: 1; min-width: 0; height: 28px; padding: 0; background: none; border: 0; outline: none; color: var(--ink); font: inherit; caret-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  a { color: var(--accent); }
  a:hover { color: var(--ink); }
  .home { display: inline-block; margin-top: 28px; color: var(--dim); }
  @media (max-width: 760px) { main { padding: 20px 16px 32px; } input { font-size: 16px; } }
</style>
</head>
<body>
<main>
  <p><span class="ps">llü@7thst<i>:~$</i></span> cd <span id="path">/</span></p>
  <p class="e">bash: cd: <span id="path-2">/</span>: esta carta no está en la baraja</p>
  <p class="d" lang="en">this card isn't in the deck.</p>
  <div class="gap"></div>
  <p class="d">escribe <span class="i">baraja</span> para regresar, o <span class="i">help</span> · <span lang="en">type <span class="i">deck</span> to go back, or <span class="i">help</span></span></p>
  <div id="out" role="log" aria-live="polite"></div>
  <form id="prompt" autocomplete="off">
    <label for="cmd" class="ps">llü@7thst<i>:~$</i></label>
    <input id="cmd" type="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
  </form>
  <a class="home" href="/">regresar a la música · <span lang="en">back to the music</span></a>
</main>
<script src="/js/lost.js"></script>
</body>
</html>
